<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Creator Home</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <div id="menu">
    <button class="sidebar-button" onclick="window.location.href='CRhome.html'">Home</button>
    <button class="sidebar-button" onclick="window.location.href='CRsettings.html'">Settings</button>
    <button class="sidebar-button" style="background-color: lightgray;">Courses</button>
    <button class="sidebar-button">Metrics</button>
  </div>

  <div class="contents">
    <button id="AddCourse">+ Add course</button>
    <div>
      <button id="show-drafts">Drafts</button>
      <button id="show-published">Published</button>
    </div>

    <div id="drafts">
      <!-- draft courses go here -->
      <p>Draft course list...</p>
    </div>

    <div id="published" style="display:none;">
      <!-- published courses go here -->
      <p>Published course list...</p>
    </div>
  </div>
  <div id="courseModal" style="
  display: none;
  position: fixed;
  bottom: 100px;
  right: 40px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
  padding: 20px;
  width: 300px;
">
  <h3>Add Course</h3>
  <input id="titleInput" type="text" placeholder="Course Title" style="width:100%; margin-bottom:10px;">
  <textarea id="descInput" placeholder="Course Description" style="width:100%; height:80px;"></textarea>
  <button id="saveCourseBtn" style="margin-top:10px; background-color:#28a745; color:white; width:100%;">Save</button>
</div>

<script type="module" src="scripts/auth.js"></script>
<script type="module">
  import { auth } from "./scripts/auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

  const addBtn = document.getElementById("AddCourse");
  const modal = document.getElementById("courseModal");
  const saveBtn = document.getElementById("saveCourseBtn");

  let user = null;

  // Listen for auth state
  onAuthStateChanged(auth, (u) => {
    user = u;
    console.log("Auth state updated:", user);
  });

  addBtn.onclick = () => {
    modal.style.display = modal.style.display === "none" ? "block" : "none";
  };

  function cryptoRandomString36(length) {
    const array = new Uint8Array(length);
    window.crypto.getRandomValues(array);
    let result = '';
    for (let i = 0; i < length; i++) {
        // Map each byte to 0–35
        result += (array[i] % 36).toString(36);
    }
    return result;
}

  saveBtn.onclick = async () => {
    if (!user) {
      alert("Please sign in first!");
      return;
    }

    const token = await auth.currentUser.getIdToken();

    const title = document.getElementById("titleInput").value;
    const description = document.getElementById("descInput").value;
    
    async function fetching() {
    const courseid = cryptoRandomString36(10);

    const payload = {
        coursetitle: title,
        coursedescription: description,
        courseimageurl: "sss",
        coursecontenturl: "sss",
        coursesizebytes: 0,
        coursetype: "private",
        ispublished: false,
        courseid: courseid,
        creatorid: ""
    };

    let attempt = 0;
    let response;

    while (attempt < 3) {
        attempt++;

        response = await fetch("http://localhost:5046/api/course/addcourse", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (response.ok) return response;     // success → exit loop
    }

    return response; // last failed response
}


    const response = await fetching();
    const data = await response.json();

    if (response.ok) {
    alert("Course added successfully!");
    modal.style.display = "none";
    document.getElementById("titleInput").value = "";
    document.getElementById("descInput").value = "";
  } else {
    alert("Error: " + (data.message || data.error || "Failed to add course"));
  }
};
</script>


</body>
</html>
