function getImageSrc(imageLink) {
  // If it's already a valid URL (http/https), use it directly
  if (imageLink.startsWith('http://') || imageLink.startsWith('https://')) {
    return imageLink;
  }
  
  // If it's already a data URI, use it directly
  if (imageLink.startsWith('data:')) {
    return imageLink;
  }
  
  // Otherwise, treat it as base64 and detect the format
  // Check the first few bytes to determine image type
  const imageType = detectImageType(imageLink);
  return `data:${imageType};base64,${imageLink}`;
}

function detectImageType(base64String) {
  // Get the first few characters to check the magic bytes
  const signatures = {
    '/9j/': 'image/jpeg',  // JPEG
    'iVBOR': 'image/png',  // PNG
    'R0lGO': 'image/gif',  // GIF
    'UklGR': 'image/webp', // WebP
    'Qk': 'image/bmp',     // BMP
    'PHN2Zy': 'image/svg+xml', // SVG
  };
  
  for (const [signature, mimeType] of Object.entries(signatures)) {
    if (base64String.startsWith(signature)) {
      return mimeType;
    }
  }
  
  // Default to JPEG if we can't detect
  return 'image/jpeg';
}

function renderGrid(courses) {
  // Clear existing cards first
  document.getElementById("drafts").innerHTML = "";
  document.getElementById("published").innerHTML = "";
  
  if (courses.length === 0) {
    document.getElementById("drafts").innerHTML = "<p>No draft courses available.</p>";
    document.getElementById("published").innerHTML = "<p>No published courses available.</p>";
    return;
  }

  let draftCount = 0;
  let publishedCount = 0;

  courses.forEach(course => {
    if (course.ispublished) {
      renderCard("published", course.coursetitle, course.courseimage, course.courseid, true);
      publishedCount++;
    } else {
      renderCard("drafts", course.coursetitle, course.courseimage, course.courseid, false);
      draftCount++;
    }
  });

  // Add placeholder messages if no courses in a category
  if (draftCount === 0) {
    document.getElementById("drafts").innerHTML = "<p>No draft courses available.</p>";
  }
  if (publishedCount === 0) {
    document.getElementById("published").innerHTML = "<p>No published courses available.</p>";
  }
}

function openOverlay(courseid) {
  const course = courses.find(c => c.courseid === courseid);
  if (!course){console.error("Course not found:", courseid); return;}
  document.getElementById("ovTitle").textContent = course.coursetitle;
  document.getElementById("ovDesc").textContent = course.coursedescription || "No description available.";
  document.getElementById("ovImage").src = getImageSrc(course.courseimage);
  document.getElementById("courseOverlay").style.display = "flex";
  document.getElementById("ovClose").onclick = () => {
    document.getElementById("courseOverlay").style.display = "none";
  };
}

async function getCourses() {
    if (!auth.currentUser) {
        console.error("User not authenticated");
        return [];
    }

    const token = await auth.currentUser.getIdToken();

    let response;

    try {
        response = await fetch("http://localhost:5046/api/course/getcourses", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });
    } catch (networkError) {
        console.error("Network error:", networkError);
        return [];
    }

    if (!response.ok) {
        console.error("Server error:", response.status);
        return [];
    }

    return await response.json(); // returns array of DTO
}

async function loadCourses() {
  courses = await getCourses();
  renderGrid(courses);
}
