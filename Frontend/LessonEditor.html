<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lesson Editor</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div id="lesson-editor">
  <input id="lesson-title" type="text" placeholder="Lesson Title">

  <textarea id="lesson-description" placeholder="Lesson Description"></textarea>

  <div id="files-section">
    <button id="add-file-btn">➕ Add File</button>
    <div id="file-list"></div>
  </div>

  <button id="save-lesson-btn">💾 Save Lesson</button>
</div>
    <script type="module" src="scripts/auth.js"></script>
    <script src="scripts/LessonEditor.js"></script>
    <style>
#lesson-editor {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 500px;
  margin: auto;
  font-family: sans-serif;
}
.file-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
input[type="text"], textarea {
  width: 100%;
  padding: 6px;
  border-radius: 4px;
  border: 1px solid #aaa;
}
button {
  cursor: pointer;
}
</style>

</body>
</html>
